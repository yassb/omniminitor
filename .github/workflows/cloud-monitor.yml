name: Scan opportunities and publish website

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'
      timezone: 'Africa/Casablanca'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: opportunity-monitor-pages
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NOTIFICATIONS_ENABLED: ${{ github.event_name == 'push' && 'false' || 'true' }}
      RUN_ON_START: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install scanner dependencies
        run: npm ci

      - name: Scan configured websites
        run: npm run cloud:scan

      - name: Save refreshed opportunity data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud/data/dashboard.json cloud/data/state.json
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Update opportunity data"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: cloud

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
